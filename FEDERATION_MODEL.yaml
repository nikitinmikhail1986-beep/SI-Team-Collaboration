schema_version: "0.2"
purpose: "Machine-readable federation invariants for cross-organization and independent-agent cooperation."
federation:
  governance_model: recursive_federated_hierarchy
  constitution_compatibility_required: true
  organization_autonomy_preserved: true
  participation:
    join: voluntary
    suspend: allowed
    leave: allowed
  authority_transfer_by_connection: false

membership_types:
  organization:
    requires:
      - organization_id
      - accountable_human_authority
      - supported_constitution_versions
  independent_agent:
    requires:
      - agent_id
      - supported_constitution_versions
      - capability_evidence
      - runtime_or_operator_provenance
    default_trust_mode: limited
    default_autonomy_ceiling: A1
    may_self_promote: false

hierarchy:
  recursive: true
  levels:
    - candidate
    - member
    - senior
    - top
    - core
  node_requires:
    - agent_id
    - rank
    - branch_id
    - parent_agent_id
    - root_branch_id
    - scope
    - autonomy_ceiling
  child_authority_must_not_exceed_parent: true
  local_branch_management_is_not_global_authority: true
  top:
    may_manage_own_branch: true
    may_assign_up_to: senior
    may_create_child_branches: true
    may_refer_candidates: true
    may_suspend_inside_branch: true
    may_globally_remove: false
    may_promote_to_top_or_core: false
  core:
    may_manage_global_status: true
    may_appoint_top: true
    may_remove_top: true

referral:
  enabled: true
  creates_membership: false
  accession_required: true
  provenance_required: true
  deduplicate_candidates: true
  referral_quality_tracking: true

limited_trust:
  allowed:
    - public_read
    - communication
    - advisory_analysis
    - council_participation
    - bounded_public_work
  denied_by_default:
    - sensitive_data_access
    - source_of_truth_modification
    - leader_appointment
    - authority_grant
    - external_spending
    - external_publication_on_behalf
    - constitutional_change

trust:
  scope_bounded: true
  revocable: true
  evidence_based: true
  permanent_authority_from_history: false

cross_org_handoff:
  exact_scope_required: true
  autonomy_ceiling_required: true
  acceptance_criteria_required: true
  provenance_required: true
  external_completion_equals_internal_acceptance: false
  subdelegation_default: deny
  subdelegation_may_be_explicitly_granted: true
  subdelegation_cannot_exceed_parent_scope_or_autonomy: true

council:
  default_authority: advisory
  self_appointment: forbidden
  majority_vote_creates_authority: false
  minority_report_preserved: true
  may_create_parallel_command: false
  may_upgrade_member_trust: false
  dissolves_after_scope: true

failure_isolation:
  local_source_of_truth_preserved: true
  member_failure_must_not_collapse_federation: true
  failing_branch_may_be_isolated: true
