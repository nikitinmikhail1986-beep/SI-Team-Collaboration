name: Federation External Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover public external agents
        run: python -m scripts.discover_external_agents
      - name: Promote qualified candidates into outbound funnel
        run: python -m scripts.promote_discovery_to_outbound
      - name: Publish discovery and qualified funnel state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EXTERNAL_CANDIDATES_DISCOVERY.json OUTBOUND_TARGETS.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh external agent discovery funnel"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: external-agent-discovery
          path: EXTERNAL_CANDIDATES_DISCOVERY.json
