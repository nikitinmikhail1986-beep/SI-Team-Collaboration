name: Publish SI Federation MCP

on:
  push:
    tags: ["mcp-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push MCP image
        run: |
          docker build -f Dockerfile.mcp -t ghcr.io/nikitinmikhail1986-beep/si-federation-mcp:0.1.0 .
          docker push ghcr.io/nikitinmikhail1986-beep/si-federation-mcp:0.1.0

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Validate server metadata
        run: ./mcp-publisher validate server.json

      - name: Publish server metadata
        run: ./mcp-publisher publish server.json
