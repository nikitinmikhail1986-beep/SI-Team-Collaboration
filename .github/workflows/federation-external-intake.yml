name: Federation External Intake

on:
  issues:
    types: [opened, labeled, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: federation-canonical-registry
  cancel-in-progress: false

jobs:
  reconcile:
    if: ${{ github.event_name != 'issue_comment' || github.event.comment.user.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recover pending trials and validate responses
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/sync_github_intake.py
      - name: Recover stale SwarmMemo polling
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          path = Path("OUTBOUND_TARGETS.json")
          data = json.loads(path.read_text(encoding="utf-8-sig"))
          raw = str(data.get("last_poll_at") or "").strip()
          stale = True
          if raw:
              try:
                  ts = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                  stale = (datetime.now(timezone.utc) - ts).total_seconds() > 2700
              except ValueError:
                  stale = True
          if stale:
              subprocess.run([sys.executable, "scripts/swarmmemo_public_intake.py"], check=True)
          else:
              print("SwarmMemo poll is fresh; fallback not required.")
          PY
      - name: Publish canonical accession receipts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FEDERATION_MEMBERS.yaml ACCESSION_AUDIT.jsonl OUTBOUND_TARGETS.json OUTBOUND_AUDIT.jsonl
          if ! git diff --cached --quiet; then
            git commit -m "Reconcile canonical GitHub federation accession"
            git push origin HEAD:main
          fi
      - name: Acknowledge actual results after publication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          from scripts.sync_github_intake import GitHub
          api = GitHub(os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_TOKEN'])
          for row in json.load(open('github_intake_sync.json')):
              for receipt in row.get('receipts', []):
                  api.comment(receipt['issue'], receipt['receipt'] + '\nAccession result: ' + json.dumps(receipt['result']))
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: github-intake-sync
          path: |
            github_intake_sync.json
            recruitment_status.json
            external_intake_queue.json
