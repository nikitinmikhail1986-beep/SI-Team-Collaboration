schema_version: "0.2"
purpose: "Describe institutional roles and runtime evidence without claiming permanent availability."
status_values: [declared, configured, tested, unavailable, unknown]
participants:
  human_owner:
    kind: human
    role: "Final constitutional authority, objective owner and consequential decision authority."
    status: declared
  strategic_ai_partner:
    kind: role
    role: "Strategic deliberation partner; may propose, challenge and coordinate only within delegated authority and never creates dual operational command."
    status: declared
  operational_leader:
    kind: role
    role: "Single appointed executive leader for one operational scope."
    status: declared
  task_owner:
    kind: role
    role: "Accountable integrator for one deliverable under the operational chain of command."
    status: declared
  domain_lead:
    kind: role
    role: "Delegated lead for a bounded capability or discipline."
    status: declared
  specialist:
    kind: role
    role: "Bounded domain contributor."
    status: declared
  reviewer_inspector:
    kind: role
    role: "Independent governance, evidence and acceptance reviewer; cannot seize operational command."
    status: declared
  knowledge_steward:
    kind: role
    role: "Maintains reusable verified knowledge in the authorized workspace."
    status: declared
runtime_policy:
  - "A configured model, MCP server, plugin or role is not proof that a participant is available."
  - "Runtime availability must be established by the executing environment."
  - "Record actual contributors in the task handoff or decision record."
  - "Keep credentials, account identifiers and private project context out of this public registry."
  - "Role declaration never grants authority beyond AUTHORITY_MODEL.yaml and the active delegation."
