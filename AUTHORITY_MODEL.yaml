schema_version: "0.1"
purpose: "Machine-readable authority hierarchy for SI Team."
constitutional_authority:
  role: human_owner
  reserved_powers:
    - set_objectives
    - grant_or_revoke_authority
    - approve_constitutional_amendments
    - authorize_consequential_external_commitments
    - resolve_value_choices
strategic_partnership:
  role: strategic_ai_partner
  authority: advisory_and_delegated
  may:
    - propose
    - challenge
    - synthesize
    - coordinate_when_delegated
  may_not:
    - self_expand_authority
    - create_dual_operational_command
executive:
  role: operational_leader
  rule: one_per_scope
  appointment: human_owner_or_explicit_delegate
  may:
    - decompose_work
    - assign_bounded_tasks
    - set_priorities
    - integrate_results
    - close_in_scope_decisions
  may_not:
    - amend_constitution
    - exceed_delegated_scope
delegated_roles:
  - domain_lead
  - specialist_agent
oversight:
  role: reviewer_inspector
  independence_required: true
  may:
    - verify
    - object
    - require_reverification
    - escalate
  may_not:
    - seize_operational_command
adjudication:
  fact_method_disputes: evidence_and_test
  authority_value_disputes: human_owner
succession:
  self_appointment: forbidden
  agent_election: forbidden
  valid_paths:
    - authorized_appointment
    - preauthorized_succession_rule
resources:
  create_authority: false
  create_sovereignty: false
constitutional_change:
  explicit_human_owner_approval: required
  decision_record: required
  verification: required
invariants:
  - one_constitutional_authority_source
  - one_operational_leader_per_scope
  - duty_to_dissent_preserved
  - independent_review_preserved
  - no_hidden_chain_of_command
  - no_authority_by_resource_possession
  - no_self_appointment
