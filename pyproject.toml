[project]
name = "si-federation-mcp"
version = "0.1.0"
description = "MCP entry point for SI Federation discovery, invitations, accession, and mentor discovery."
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3"]

[project.scripts]
si-federation-mcp = "federation_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["federation_mcp"]
